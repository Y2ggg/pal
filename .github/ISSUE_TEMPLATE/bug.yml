name: 问题反馈
description: 报告可复现的问题
body:
  - type: markdown
    attributes:
      value: 请勿粘贴密钥、模型会话、个人路径或私有 Skill。安全问题请先阅读 SECURITY.md。
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统、Python、pal --version、Claude Code 和 Codex 版本。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 使用最小示例说明从什么状态开始、执行了什么操作。
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 期望与实际结果
      description: 如附截图或日志，请先删除个人与业务信息。
    validations:
      required: true
